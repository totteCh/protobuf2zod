syntax = "proto3";
package simple;

message Person {
  string name = 1;
  int32 age = 2;
  repeated string hobbies = 3;
  Gender gender = 4;

  oneof identity {
    string nickname = 5;
    string alias = 6;
  }

  map<string, string> attributes = 7;
  map<string, int32> scores = 8;
  map<int32, Address> addresses = 9;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip = 4;
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_OTHER = 3;
}
