syntax = "proto3";

// best practices to include version number in package
package logd.v1;

import "third-party/java/remote-apis/google/rpc/status.proto";

option java_multiple_files = true;
option java_package = "com.facebook.buck.logd.proto";
option java_outer_classname = "LogdServiceOuterFile";

// Request message for [LogdService.CreateLogFile] to request a log file be
// created in file-system and/or storage
message CreateLogRequest {
  // path to which log will be streamed by logD
  string log_file_path = 1;
  // enum specifying existing types of log
  LogType log_type = 2;
}

// Response message for [LogdService.CreateLogFile]
// LogD returns client with a log file identifier
message CreateLogResponse {
  // generated id for the log file path requested by client
  int32 log_id = 1;
}

// LogMessage(s) for [LogdService.OpenLog]
// Client streams LogMessage(s) to logD, where logD writes to corresponding log
// file identified by log_id
message LogMessage {
  // log file identifier for logD
  int32 log_id = 1;
  // log content
  string log_message = 2;
}

// Existing types of logs we are currently maintaining. To be revised/extended.
enum LogType {
  LOG_TYPE_UNSPECIFIED = 0;
  LOG_TYPE_BUCK_LOG = 1;
  LOG_TYPE_BUCK_MACHINE_LOG = 2;
  LOG_TYPE_CHROME_TRACE_LOG = 3;
  LOG_TYPE_SIMPLE_CONSOLE_LOG = 4;
  LOG_TYPE_CRITICAL_PATH_LOG = 5;
  LOG_TYPE_RULE_KEY_LOG = 6;
}

// Manages LogdService APIs
service LogdService {

  // A simple, unary RPC.
  //
  // Client sends a CreateLogRequest to logD, after which logD creates a
  // corresponding log file in file-system and/or storage and returns a
  // CreateLogResponse with a generated id.
  rpc CreateLogFile(CreateLogRequest) returns (CreateLogResponse) {}

  // A client-to-server streaming RPC.
  //
  // Upon receiving a logId that corresponds with a log file created by logD,
  // client can proceed to stream LogMessage(s) to logD.
  //
  // After receiving an OpenLog call from client, logD will
  // proceed to open a writer stream to the log file identified by logId
  // and return a StreamObserver that can observe and process incoming logs from
  // client. Client can then use the returned StreamObserver to stream
  // LogMessages to logD.
  //
  // After the client finishes sending logs, it should call onCompleted() on the
  // returned StreamObserver to signal logD to close the corresponding writer
  // stream to log file.
  rpc OpenLog(stream LogMessage) returns (google.rpc.Status) {}
}
